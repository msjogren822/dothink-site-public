count":5,"r":15},{"id":"h33","type":"hub","label":"center","count":5,"r":15},{"id":"h34","type":"hub","label":"mobile","count":5,"r":15},{"id":"h35","type":"hub","label":"hits","count":5,"r":15},{"id":"h36","type":"hub","label":"microsoft","count":5,"r":15},{"id":"h37","type":"hub","label":"still","count":5,"r":15},{"id":"h38","type":"hub","label":"apps","count":5,"r":15},{"id":"h39","type":"hub","label":"block","count":5,"r":15},{"id":"h40","type":"hub","label":"stablecoin","count":4,"r":13.4},{"id":"h41","type":"hub","label":"tokenization","count":4,"r":13.4},{"id":"t0","type":"topic","label":"Goldman Sachs, Citi among banks said to commit $270 million to stablecoin venture","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/10/goldman-sachs-citi-among-banks-said-to-commit-usd270-million-to-stablecoin-venture","summary":"Goldman Sachs and Citi are among the banks reportedly committing $270 million to Project Faro, a venture that plans to issue a dollar-denominated stablecoin and is expected to be incorporated in the United States. The raise marks one of the clearest signs yet that the biggest names in traditional finance now want to own a piece of the stablecoin rails rather than merely watch crypto build them.","edition":"Spud's View: Banks, Chips, and the Race to Trust Machines","r":3.4,"kws":["stablecoin"]},{"id":"t1","type":"topic","label":"Former NYSE president says stock issuers hold the key to tokenization as Bullish builds its platform","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/10/former-nyse-president-says-stock-issuers-hold-the-key-to-tokenization-as-bullish-builds-its-platform","summary":"Stacey Cunningham, the former NYSE president who recently joined digital asset platform Bullish as its president, says stock issuers hold the key to tokenization, with Bullish's planned Equiniti acquisition and its focus on issuers central to the company's ambitions. Her argument flips the usual script: the tokenization race may be won by whoever brings the companies issuing the shares, not whoever builds the exchange.","edition":"Spud's View: Banks, Chips, and the Race to Trust Machines","r":3.4,"kws":["stock","tokenization"]},{"id":"t2","type":"topic","label":"Nvidia Erases 2026 Gains as Republicans Threaten Jensen Huang With Subpoena","source":"Decrypt","url":"https://decrypt.co/382974/nvidia-erases-2026-gains-republicans-threaten-ceo-subpoena","summary":"Nvidia has erased its entire 2026 gain as a suspected Chinese espionage case brings fresh scrutiny of CEO Jensen Huang, with Republicans threatening him with a subpoena. The selloff shows how the world's most important AI chipmaker is now priced as much on geopolitics and Washington politics as on its own earnings.","edition":"Spud's View: Banks, Chips, and the Race to Trust Machines","r":3.4,"kws":["nvidia"]},{"id":"t3","type":"topic","label":"Elon Musk Calls Claude Opus 5.5 a 'Masterpiece', Admits Grok 4.8 Won't Match It","source":"Decrypt","url":"https://decrypt.co/382956/elon-musk-calls-claude-opus-5-5-masterpiece-grok-wont-match","summary":"Elon Musk says the incoming Grok 4.8 will trail Anthropic's Claude Opus 5.5, praising his rival's model as a masterpiece while predicting Grok 5 could surpass it in two or three months. The rare public concession from a competitor doubles as a scoreboard: in the frontier-model race, even the people building the challengers are now naming the leader out loud.","edition":"Spud's View: Banks, Chips, and the Race to Trust Machines","r":3.4,"kws":["musk","claude"]},{"id":"t4","type":"topic","label":"A New AI Tool From Google DeepMind Proved the Signal Protocol Is Secure","source":"Wired AI","url":"https://www.wired.com/story/a-new-ai-tool-from-google-deepmind-formally-verified-the-signal-protocol/","summary":"Google DeepMind researchers used a new AI tool to formally verify that the Signal encryption protocol works as intended, proving the security of the messaging standard relied on by hundreds of millions of people. The team's stretch goal is far grander: applying the same formal verification to all the software of the world.","edition":"Spud's View: Banks, Chips, and the Race to Trust Machines","r":3.4,"kws":["ai","google"]},{"id":"t5","type":"topic","label":"Should you trust new AI agents with your money and data?","source":"NPR","url":"https://www.npr.org/2026/11/10/nx-s1-6018588/should-you-trust-new-ai-agents-with-your-money-and-data","summary":"NPR asks whether shoppers should trust the new generation of AI agents with their money and data, as tech companies push agentic AI as the new way to shop. The question lands just as agents move from demos to checkouts, and the answer will decide whether the agent era is a convenience upgrade or a new kind of fraud surface.","edition":"Spud's View: Banks, Chips, and the Race to Trust Machines","r":3.4,"kws":["ai","agents","data"]},{"id":"t6","type":"topic","label":"Google releases Gemini 4 Carbon with agent 'swarm' feature","source":"The Verge","url":"https://www.theverge.com/ai-artificial-intelligence/1030787/google-gemini-4-carbon-public-rollout","summary":"Google has rolled out Gemini 4 Carbon, its latest AI model, to the general public after a limited release to cybersecurity companies two weeks ago. Google calls Carbon its strongest model yet, capable of competing with the best systems from Anthropic and OpenAI, and the launch includes an agent 'swarm' feature that coordinates multiple AI agents on a single task.","edition":"Spud's View: Gemini's Swarm, Robots, and a Boardroom Storm","r":3.4,"kws":["google","gemini","agent"]},{"id":"t7","type":"topic","label":"DeepMind reveals Gemini Robotics 2.5 and open safety benchmark 'ASIMOV-jailbreak'","source":"Ars Technica","url":"https://arstechnica.com/google/2026/11/deepmind-reveals-gemini-robotics-2-5-and-open-safety-benchmark-asimov-jailbreak/","summary":"DeepMind has unveiled Gemini Robotics 2.5, a new model for controlling physical robots that is up to twice as successful at some tasks as its predecessor. Alongside it, the lab released an open safety benchmark called ASIMOV-jailbreak, designed to test whether embodied AI systems can be tricked into unsafe actions.","edition":"Spud's View: Gemini's Swarm, Robots, and a Boardroom Storm","r":3.4,"kws":["gemini"]},{"id":"t8","type":"topic","label":"Nvidia CEO Jensen Huang's affair with alleged Chinese spy: a timeline","source":"Techcrunch","url":"https://techcrunch.com/2026/11/10/nvidia-ceo-jensen-huangs-affair-with-alleged-chinese-spy-a-timeline/","summary":"TechCrunch has assembled a timeline of Nvidia CEO Jensen Huang's reported affair with a woman alleged to be a Chinese spy, a story with potential national security ramifications as the United States and China race to build the most advanced AI infrastructure. The timeline traces the relationship and the questions it raises for the world's most valuable chipmaker.","edition":"Spud's View: Gemini's Swarm, Robots, and a Boardroom Storm","r":3.4,"kws":["nvidia"]},{"id":"t9","type":"topic","label":"N-able takes its remote access service offline after researcher publishes dozens of zero-day bugs","source":"Techcrunch","url":"https://techcrunch.com/2026/11/10/n-able-takes-its-remote-access-service-offline-after-researcher-publishes-dozens-of-zero-day-bugs/","summary":"N-able, a major remote-access software provider, has taken its service offline after a security researcher published dozens of previously undisclosed zero-day vulnerabilities. The company called it a critical security incident and urged its self-hosted customers to shut down their own servers amid fears of active exploitation.","edition":"Spud's View: Gemini's Swarm, Robots, and a Boardroom Storm","r":3.4,"kws":["access"]},{"id":"t10","type":"topic","label":"eBay appears to have shut the door on third-party AI agents","source":"The Verge","url":"https://www.theverge.com/tech/1030838/ebay-ai-agents-meta-muse-agentic-shopping","summary":"eBay appears to have blocked third-party AI agents, including Meta's Muse, from browsing its platform — the latest speed bump in the race to build agentic shopping. A reader told The Verge that for several weeks his Muse agent had been curating a daily digest of watches for sale across platforms like eBay, until the access stopped.","edition":"Spud's View: Gemini's Swarm, Robots, and a Boardroom Storm","r":3.4,"kws":["ai","agents"]},{"id":"t11","type":"topic","label":"High oil prices have led to a dip in global carbon emissions","source":"Ars Technica","url":"https://arstechnica.com/science/2026/11/carbon-emissions-are-down-this-year-but-that-probably-wont-last/","summary":"High oil prices have pushed global fossil-fuel emissions down 0.4 percent this year, bucking recent trends — a rare piece of good climate news. Researchers caution the dip probably will not last, since it is driven by price pressure rather than a structural shift away from fossil fuels.","edition":"Spud's View: Gemini's Swarm, Robots, and a Boardroom Storm","r":3.4,"kws":[]},{"id":"t12","type":"topic","label":"North Korean hackers are creating memecoins to wash loot from $6.3 billion Binance hack","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/09/north-korean-hackers-are-creating-memecoins-to-wash-loot-from-usd6-3-billion-binance-hack","summary":"North Korean hackers are minting memecoins — some carrying cartoon-animal and Elon Musk branding — to launder proceeds from the $6.3 billion Binance hack, according to blockchain analytics firm Elliptic. The worthless tokens are pushed through liquidity pools to break the trail between the stolen funds and the hackers' wallets, turning the memecoin casino into a laundering rail. The scheme shows how quickly stolen crypto can be washed in plain sight on public chains, with joke coins as the cover story.","edition":"Spud's View: Chips, Hackers, and Robotaxis Under Scrutiny","r":3.4,"kws":["hackers","binance","hack"]},{"id":"t13","type":"topic","label":"Google Takes Aim at Nvidia With New AI Chips Built for Privacy and Massive Memory","source":"Decrypt","url":"https://decrypt.co/382874/google-nvidia-new-ai-chips-privacy-massive-memory-ai","summary":"Google unveiled two new AI chips aimed squarely at Nvidia's dominance: the TPU 8tx, built to protect sensitive AI workloads, and the dual-chip TPU 8i Max, designed for memory-hungry AI agents. The launch lands as Google's broader AI chip push adds pressure on Nvidia, whose GPUs still power most frontier training. If Google's silicon keeps closing the gap, the AI hardware race stops being a one-company story — and the cloud giants become chip rivals in earnest.","edition":"Spud's View: Chips, Hackers, and Robotaxis Under Scrutiny","r":3.4,"kws":["google","nvidia","ai"]},{"id":"t14","type":"topic","label":"Jensen Huang's Troubles Leave the AI Industry Reeling","source":"Wired AI","url":"https://www.wired.com/story/jensen-huangs-troubles-leaves-the-ai-industry-reeling/","summary":"Nvidia CEO Jensen Huang, whose chips and checkbook have made him the AI industry's central power broker, faces a crisis that could put that position at risk: an extramarital affair with a suspected Chinese spy. Huang reportedly began working with a PR firm known for handling sex scandals as early as October 2025, around the time he was first linked to the woman. The episode now hangs over the company the whole AI boom depends on, at the moment its dominance is being challenged from every side.","edition":"Spud's View: Chips, Hackers, and Robotaxis Under Scrutiny","r":3.4,"kws":["ai"]},{"id":"t15","type":"topic","label":"Agent Distraction","source":"Google Dev General","url":"https://developers.googleblog.com/agent-distraction/","summary":"Google analyzed more than 913,000 coding-agent sessions and found that 13% expose agents to inline TODO comments — and in 6% of encounters the agent acts on them, 83% of the time entirely unprompted by the developer. The detours are expensive: 70% more steps, 77% more tokens, and 105% more wait time per session, split between chasing closed tickets and unauthorized scope creep on open bugs. Google's fix is automated cleanup and linters — codebases need to be agent-proofed, not just human-readable.","edition":"Spud's View: Chips, Hackers, and Robotaxis Under Scrutiny","r":3.4,"kws":["agent"]},{"id":"t16","type":"topic","label":"Waymo Said It Fixed Its School Bus Problem. The US Government Says It Didn't Work","source":"Wired General","url":"https://www.wired.com/story/waymo-school-bus-problem-the-us-government-says-it-didnt-work/","summary":"Waymo recalled its software last year after several of its autonomous cars drove around stopped school buses — and now the U.S. government says the fix didn't work. Federal regulators are pressing the company for more answers as the problems persist, putting the robotaxi operator's safety record under fresh scrutiny. The episode is a reminder that self-driving credibility is earned one edge case at a time, and a school zone is the hardest test there is.","edition":"Spud's View: Chips, Hackers, and Robotaxis Under Scrutiny","r":3.4,"kws":["work"]},{"id":"t17","type":"topic","label":"Robinhood backs tokenization of its stock on OKX–ICE platform even as most companies opt out","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/09/robinhood-backs-tokenization-of-its-stock-on-okx-ice-platform-even-as-most-companies-opt-out","summary":"Robinhood is backing the tokenization of its own stock on the OKX–ICE platform, even as most companies are opting out of having their shares tokenized. The move puts the brokerage on the other side of a split in corporate America over bringing equities on-chain. For Robinhood, which has pushed tokenization as a core strategy, the stance is a bet that stock tokens become market infrastructure rather than a novelty — and that it gets there first.","edition":"Spud's View: Chips, Hackers, and Robotaxis Under Scrutiny","r":3.4,"kws":["robinhood","tokenization","stock","companies"]},{"id":"t18","type":"topic","label":"Anthropic joins AI's natural gas frenzy, buys $3.4B worth of turbines","source":"TechCrunch","url":"https://techcrunch.com/2026/11/09/anthropic-joins-ais-natural-gas-frenzy-buys-3-4b-worth-of-turbines/","summary":"Anthropic has bought $3.4 billion worth of natural gas turbines, joining the AI industry's rush to secure its own power generation as data-center demand strains the grid. The deal puts the Claude maker in the same energy-buying frenzy as its rivals, raising the question of whether AI companies can keep scaling compute without becoming power companies themselves — and whether the turbines prove a smart hedge or an expensive case of buyer's remorse.","edition":"Spud's View: AI's Power Grab, Parking Lots, and a CEO Scandal","r":3.4,"kws":["anthropic","ai"]},{"id":"t19","type":"topic","label":"Trump's 60 Minutes interview touched on AI safety, threat to arrest an AI exec","source":"The Verge","url":"https://www.theverge.com/ai-artificial-intelligence/1029802/trump-60-minutes-ai","summary":"Donald Trump told 60 Minutes that the AI safety risks flagged by AI executives are \"not nearly as real as they talk,\" adding that the risk \"can be managed\" and pointing to the Justice Department's role in managing it. The president also raised the prospect of arresting an AI executive, a striking escalation in the administration's posture toward the industry even as labs warn their own models carry serious risks.","edition":"Spud's View: AI's Power Grab, Parking Lots, and a CEO Scandal","r":3.4,"kws":["ai"]},{"id":"t20","type":"topic","label":"Disney and Adobe are building generative AI tools together","source":"The Verge","url":"https://www.theverge.com/tech/1029773/disney-adobe-generative-ai-partnership","summary":"Disney and Adobe have announced a multiyear partnership to build proprietary, artist-led generative AI models for Disney's production pipeline, unveiled at Adobe MAX. Adobe will give Disney early access to its latest tools across film, theme parks, and cruise lines — a bet that the future of studio AI is built in-house with artists in the loop rather than rented from generic models.","edition":"Spud's View: AI's Power Grab, Parking Lots, and a CEO Scandal","r":3.4,"kws":["ai"]},{"id":"t21","type":"topic","label":"Nvidia CEO's affair becomes a national security problem","source":"Ars Technica","url":"https://arstechnica.com/tech-policy/2026/11/ceo-jensen-huang-admits-affair-as-nvidia-probes-possible-chinese-espionage/","summary":"Nvidia CEO Jensen Huang has admitted to an affair as the chipmaker investigates whether Chinese intelligence targeted him through the relationship, turning a personal scandal into a national security problem for the world's most valuable chip company. The probe underscores how the AI hardware race has made Nvidia's leadership a target — and how personal vulnerabilities now carry geopolitical weight.","edition":"Spud's View: AI's Power Grab, Parking Lots, and a CEO Scandal","r":3.4,"kws":["nvidia"]},{"id":"t22","type":"topic","label":"Uber launches parking service following SpotHero acquisition, with an eye on robotaxis","source":"TechCrunch","url":"https://techcrunch.com/2026/11/09/uber-launches-parking-service-following-spothero-acquisition-with-an-eye-on-robotaxis/","summary":"Uber has launched a parking service following its acquisition of SpotHero, expanding beyond ride-hailing into the business of parking your car — with an eye on robotaxis. The move positions Uber to manage the full journey, from the moment a car is parked to the moment a self-driving vehicle picks you up, as the company keeps stacking services around its core platform.","edition":"Spud's View: AI's Power Grab, Parking Lots, and a CEO Scandal","r":3.4,"kws":[]},{"id":"t23","type":"topic","label":"🏴 FREE: Robinhood Chain's Hook Economy","source":"Bankless","url":"https://www.bankless.com/read/free-a-field-guide-to-robinhood-chains-hook-economy","summary":"Robinhood Chain has become the most crowded testing ground for Uniswap v4 hooks, the programmable add-ons that let developers customize how decentralized exchanges behave. Bankless's field guide walks through the hook economy taking shape on the chain — a sign that Robinhood's blockchain ambitions are drawing real builder activity, not just headlines.","edition":"Spud's View: AI's Power Grab, Parking Lots, and a CEO Scandal","r":3.4,"kws":["robinhood"]},{"id":"t24","type":"topic","label":"What the election results mean for crypto: State of Crypto","source":"Coindesk","url":"https://www.coindesk.com/policy/2026/11/08/what-the-election-results-mean-for-crypto-state-of-crypto","summary":"Democrats retook both the House and the Senate in Tuesday's midterms, projected to hold at least 54 Senate seats and more than 253 House seats, and the crypto industry now faces a far less friendly Congress. Senator Richard Blumenthal, who will head the Senate Permanent Subcommittee on Investigations, has already sent fresh letters to World Liberty Financial, the company behind the $TRUMP memecoin, Binance, Tether and ballroom donors including Coinbase's Brian Armstrong, demanding records by November 30 — with a market-structure bill's chances now slim and Senator Elizabeth Warren set to chair the Banking Committee.","edition":"Spud's View: Blue Wave, Blacklisted Exchange, and World Models","r":3.4,"kws":["crypto"]},{"id":"t25","type":"topic","label":"U.S. Treasury moves to cut off crypto exchange MEXC over $16 billion in alleged illicit flows","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/07/u-s-treasury-moves-to-cut-off-crypto-exchange-mexc-over-usd16-billion-in-alleged-illicit-flows","summary":"The U.S. Treasury's Financial Crimes Enforcement Network ordered American financial institutions to stop moving funds to or from crypto exchange MEXC, alleging at least $16 billion in illicit flows over five years. MEXC is the largest exchange ever hit under Section 9714, a Russia-focused anti-money-laundering law previously used only against far smaller exchanges like Bitzlato; FinCEN says MEXC processed nearly $1.5 billion linked to Russian sanctions evasion and about $1 billion in transfers to Iranian exchanges. The ban takes effect 30 days after publication in the Federal Register.","edition":"Spud's View: Blue Wave, Blacklisted Exchange, and World Models","r":3.4,"kws":["crypto"]},{"id":"t26","type":"topic","label":"This Bitcoin Developer’s Idea Would Make Quantum Attacks a Losing Bet","source":"Decrypt","url":"https://decrypt.co/382761/bitcoin-developer-quantum-landmines-losing-bet","summary":"Bitcoin developer Cory Fields has proposed making quantum attacks on vulnerable wallets a losing bet by requiring future attackers to post Bitcoin as collateral before they can touch the coins. The scheme would give prepared owners a chance to recover their funds and collect a potentially costly penalty from the attacker — turning the quantum threat from a one-sided heist into a gamble where the thief risks their own stake.","edition":"Spud's View: Blue Wave, Blacklisted Exchange, and World Models","r":3.4,"kws":["bitcoin"]},{"id":"t27","type":"topic","label":"World Models Will Soon Be Inescapable. Here’s What You Need to Know","source":"Wired AI","url":"https://www.wired.com/story/world-models-will-soon-be-inescapable-what-you-need-to-know/","summary":"World models are moving AI from text into 3D space, simulating real-world physics so robots and autonomous cars can learn to navigate reality. WIRED's explainer argues the technology will soon be inescapable — the next layer of AI after chatbots, giving machines a working model of how the physical world behaves instead of just patterns in words.","edition":"Spud's View: Blue Wave, Blacklisted Exchange, and World Models","r":3.4,"kws":["models"]},{"id":"t28","type":"topic","label":"A 55-Year-Old Math Problem Was Solved—This Time by Humans","source":"Wired General","url":"https://www.wired.com/story/a-55-year-old-math-problem-was-solved-this-time-by-humans/","summary":"A group of young mathematicians has solved a conjecture that stood unanswered for 55 years, first inspired by juggling, using randomness and friendship rather than brute-force computation. The result is a pointed counterweight to the AI moment: the breakthrough came from human collaboration and creative leaps, not from a model — a reminder that some of the hardest problems still yield to people thinking together.","edition":"Spud's View: Blue Wave, Blacklisted Exchange, and World Models","r":3.4,"kws":["time"]},{"id":"t29","type":"topic","label":"The disadvantages of buying tech from other countries","source":"Engadget","url":"https://www.engadget.com/2309284/disadvantages-buying-tech-from-other-countries/","summary":"Engadget's Filipe Espósito warns that importing a phone or laptop from abroad can leave buyers with the wrong hardware, no warranty coverage, and missing features. Regional variants differ in real ways — Chinese iPhones carry two physical SIM slots and limited Apple Intelligence access, U.S. iPhones dropped the SIM tray with the iPhone 14, and a phone built for another country's cellular bands may not work on U.S. 5G or support VoLTE and Wi-Fi Calling.","edition":"Spud's View: Blue Wave, Blacklisted Exchange, and World Models","r":3.4,"kws":[]},{"id":"t30","type":"topic","label":"OpenAI raises $11B at a $1.25T valuation","source":"Hacker News","url":"https://247wallst.com/investing/2026/11/07/openai-just-raised-11-billion-at-a-1-25-trillion-valuation-below-the-1-4-trillion-it-first-sought/","summary":"OpenAI closed an $11 billion first tranche at a $1.25 trillion valuation, below the $1.4 trillion it first sought, with up to $9 billion more still unclosed. CFO Sarah Friar says the business grew 70% quarter over quarter, yet the gap between OpenAI's growth story and investor appetite is now landing on Microsoft and Nvidia — and Anthropic is reportedly planning a Nasdaq listing in mid-November at a valuation near $1.5 trillion, down from roughly $2 trillion.","edition":"Spud's View: Trillion-Dollar Raises, Spies, and Ballot Blowback","r":3.4,"kws":["openai","valuation"]},{"id":"t31","type":"topic","label":"Megaspeed exec was recruited to spy on Nvidia CEO, according to US intelligence memo","source":"Techcrunch","url":"https://techcrunch.com/2026/11/07/chinese-exec-was-recruited-to-spy-on-nvidia-ceo-according-to-us-intelligence-memo/","summary":"A US intelligence memo circulated earlier this year reportedly claims China's Ministry of State Security recruited a female technology executive at Megaspeed to spy on Nvidia CEO Jensen Huang. The allegation puts a human face on the AI chip rivalry: the fight over advanced semiconductors is being waged through recruitment and surveillance as well as export controls, and Nvidia sits squarely at the center of it.","edition":"Spud's View: Trillion-Dollar Raises, Spies, and Ballot Blowback","r":3.4,"kws":["nvidia"]},{"id":"t32","type":"topic","label":"After the midterms, things are looking rocky for Elon Musk and data centers","source":"Techcrunch","url":"https://techcrunch.com/2026/11/07/after-the-midterms-things-are-looking-rocky-for-elon-musk-and-data-centers/","summary":"Democrats' historic midterm victory could reshape the tech industry's footing, with voters rejecting data centers in dozens of local ballot measures and electing politicians like Texas governor-elect Gina Hinojosa, who campaigned on restricting them. Elon Musk, who donated roughly half a billion dollars to Republicans, seems to have gotten basically nothing for it, per TechCrunch's Equity podcast — a stark reversal for the industry's biggest political bettor.","edition":"Spud's View: Trillion-Dollar Raises, Spies, and Ballot Blowback","r":3.4,"kws":["musk","data","centers"]},{"id":"t33","type":"topic","label":"Coinbase Enables Borrowing Against Gold via Morpho","source":"Bankless","url":"https://www.bankless.com/read/news/coinbase-enables-borrowing-against-gold-via-morpho","summary":"Coinbase now lets eligible US users borrow USDC against Paxos' tokenized gold (PAXG) on Base, the first non-crypto collateral on Coinbase Borrow. The move, built on Morpho's lending protocol, blurs the line between traditional stores of value and DeFi: gold — the oldest safe haven — is now borrowable collateral inside a crypto app.","edition":"Spud's View: Trillion-Dollar Raises, Spies, and Ballot Blowback","r":3.4,"kws":[]},{"id":"t34","type":"topic","label":"Chatbots might be coming to Apple’s HomeView","source":"The Verge","url":"https://www.theverge.com/tech/1029526/chatbots-might-be-coming-to-apples-homeview","summary":"Code in the iOS 27.3 beta suggests Apple could add chatbot support to its HomeView smart home hub, with a flag for a “Conversational Apps” category. No details yet on which apps would qualify, but AI chatbots like ChatGPT and Claude are the obvious candidates — a sign Apple is quietly opening its home hub to the AI assistants it once kept at arm's length.","edition":"Spud's View: Trillion-Dollar Raises, Spies, and Ballot Blowback","r":3.4,"kws":["apple"]},{"id":"t35","type":"topic","label":"Llama-modchip: 284B DeepSeek on 64GB RAM, no GPU","source":"Hacker News","url":"https://github.com/synchopate/llama-modchip","summary":"A new open-source project, llama-modchip, runs the 284-billion-parameter DeepSeek-V4-Flash model on a pure 64GB CPU — no GPU — at 256K context, hitting 44.4 tokens per second in prefill and 9.1–14.7 tokens per second in generation. It is a striking demo of how far CPU inference has come, and a reminder that frontier-scale models are slipping out of the data center and onto ordinary hardware.","edition":"Spud's View: Trillion-Dollar Raises, Spies, and Ballot Blowback","r":3.4,"kws":[]},{"id":"t36","type":"topic","label":"AI Chip Stocks Bounce After Global Rout—But Is the Bubble Starting to Burst?","source":"Decrypt","url":"https://decrypt.co/382770/ai-chip-stocks-bounce-global-rout-bubble-starting-burst","summary":"AI chip stocks rebounded on Friday after a historic global selloff, offering investors brief relief after one of the sharpest routs in recent memory. The bounce raises the question of whether the AI trade is stabilizing or merely pausing: politics and mounting debt could still turn a correction into something much worse, and the market's nerves remain frayed after a week that tested faith in the AI boom's durability.","edition":"Spud's View: Rebounds, Opt-Outs, and the Price of Going Digital","r":3.4,"kws":["ai"]},{"id":"t37","type":"topic","label":"Apple Completes the Set: Every Magnificent Seven Stock Opts Out of OKX-ICE Venue","source":"Decrypt","url":"https://decrypt.co/382768/apple-meta-every-magnificent-seven-stock-opts-out-okx-ice-venue","summary":"Apple and Meta have now objected to the planned OKX-ICE venue for tokenized stocks, meaning all seven of the biggest U.S. tech companies have asked to keep their shares off it. The unanimous opt-out is a setback for the effort to bring blue-chip equities onto crypto rails, leaving the tokenized-stock experiment to smaller issuers while Wall Street's giants watch from the sidelines.","edition":"Spud's View: Rebounds, Opt-Outs, and the Price of Going Digital","r":3.4,"kws":["apple","stock"]},{"id":"t38","type":"topic","label":"Binance users in some European countries told to pull crypto before fees kick in, with accounts closing by year end","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/07/binance-users-in-some-european-countries-told-to-pull-crypto-before-fees-kick-in-with-accounts-closing-by-year-end","summary":"Binance has told users in some European countries to withdraw their crypto before fees kick in, with affected accounts set to close on December 31. Users in Spain, France, and Poland say they received similar notices, a reminder that even the world's largest exchange is still retreating from markets where the regulatory math no longer works.","edition":"Spud's View: Rebounds, Opt-Outs, and the Price of Going Digital","r":3.4,"kws":["binance","crypto"]},{"id":"t39","type":"topic","label":"The Fridge-Hacking Spree Is an Internet-of-Things Wake-Up Call","source":"Wired General","url":"https://www.wired.com/story/kernel-panic-refrigeration-hacks-internet-of-things/","summary":"Blood labs and grocery stores have been hit by an escalating spree of hacks targeting internet-connected refrigeration, exposing the real risks to critical infrastructure from basic security lapses. The attacks show how deeply connected devices are now embedded in systems that keep food safe and medical samples viable — and how little it takes to break them.","edition":"Spud's View: Rebounds, Opt-Outs, and the Price of Going Digital","r":3.4,"kws":[]},{"id":"t40","type":"topic","label":"I’m sick of Google running my life, but the /e/OS Fairphone wasn't the de-Googled solution I needed","source":"Techradar Phones","url":"https://www.techradar.com/phones/android/i-spent-a-month-trying-to-de-google-with-the-fairphone-6-plus-but-it-left-me-wishing-for-my-android-phone-back","summary":"The Fairphone 6 Plus running /e/OS was supposed to be the de-Googled phone for someone sick of Google running their life, but a month-long test ended in disappointment. The reviewer found the privacy-first handset wasn't the solution they needed and was left wishing for their Android phone back — a reminder that escaping the ecosystem is harder than swapping the hardware.","edition":"Spud's View: Rebounds, Opt-Outs, and the Price of Going Digital","r":3.4,"kws":["google"]},{"id":"t41","type":"topic","label":"Sony Axing Game Discs Will Have Outsized Impact on Low-Income Gamers, Experts Say","source":"Decrypt","url":"https://decrypt.co/382714/sony-axing-game-discs-will-have-outsized-impact-on-low-income-gamers-experts-say","summary":"Sony's move toward a disc-free PlayStation will have an outsized impact on low-income gamers, experts say, pricing out players who depend on cheap secondhand discs and shared copies. In much of Africa, where digital-only gaming often means breaking Sony's rules to get games at all, the shift could push an entire audience further to the margins.","edition":"Spud's View: Rebounds, Opt-Outs, and the Price of Going Digital","r":3.4,"kws":[]},{"id":"t42","type":"topic","label":"OpenAI reportedly raises an additional $11 billion at a $1.25 trillion valuation","source":"TechCrunch","url":"https://techcrunch.com/2026/11/06/openai-reportedly-raises-an-additional-11-billion-at-a-1-25-trillion-valuation/","summary":"OpenAI has reportedly raised an additional $11 billion as part of a funding round that has not yet closed but is expected to in the coming weeks, valuing the company at $1.25 trillion. The raise extends a funding spree that has made the ChatGPT maker one of the most valuable private companies in history, even as it pours capital into compute, data centers, and talent to stay ahead of rivals racing to build the same future.","edition":"Spud's View: AI's Trillion-Dollar Week Meets Fragile Cables","r":3.4,"kws":["openai","reportedly","valuation"]},{"id":"t43","type":"topic","label":"The US let Nvidia sell chips to an empty office in China","source":"The Verge","url":"https://www.theverge.com/ai-artificial-intelligence/1029483/nvidia-ai-chips-china-blacklist-government","summary":"Nvidia's H200 AI chips were cleared for sale to New Matrix, a Chinese firm on the U.S. government's approved list, even though its offices are empty, according to The New York Times. The report raises questions about whether the Commerce Department or Nvidia is doing real due diligence on the firms allowed to handle advanced AI hardware, and it undercuts the credibility of the export-control regime meant to keep the most powerful chips out of the wrong hands.","edition":"Spud's View: AI's Trillion-Dollar Week Meets Fragile Cables","r":3.4,"kws":["nvidia"]},{"id":"t44","type":"topic","label":"Crusoe sells troubled Wyoming data center project to Google","source":"TechCrunch","url":"https://techcrunch.com/2026/11/06/crusoe-sells-troubled-wyoming-data-center-project-to-google/","summary":"Google is buying Crusoe's troubled Wyoming data-center project, a deal that highlights how hard it has become to build the massive AI data centers the industry wants. The project ran into trouble during development, and the sale hands Google a site it can finish while Crusoe steps back from one of the most capital-hungry corners of the AI buildout, where delays and cost overruns have become the norm rather than the exception.","edition":"Spud's View: AI's Trillion-Dollar Week Meets Fragile Cables","r":3.4,"kws":["data","center","google"]},{"id":"t45","type":"topic","label":"A Field Guide to Robinhood Chain's Hook Economy","source":"Bankless","url":"https://www.bankless.com/read/a-field-guide-to-robinhood-chains-hook-economy","summary":"Robinhood Chain has become the most crowded testing ground for Uniswap v4 hooks, the customizable plug-ins that let developers reshape how decentralized exchanges behave. Bankless maps the hook economy taking shape on the chain, from fee experiments to new trading mechanics, as Robinhood's crypto ambitions move from brokerage app toward on-chain infrastructure.","edition":"Spud's View: AI's Trillion-Dollar Week Meets Fragile Cables","r":3.4,"kws":["robinhood"]},{"id":"t46","type":"topic","label":"Ships loiter near subsea cables amid Iran's warnings to Trump","source":"Ars Technica","url":"https://arstechnica.com/gadgets/2026/11/ships-loiter-near-subsea-cables-amid-irans-warnings-to-trump/","summary":"Ships have been loitering near subsea cables as Iran threatened to attack the undersea infrastructure if the United States escalates military strikes again. The cables carry the vast majority of the world's internet traffic, and the warnings put a spotlight on how exposed the physical backbone of the global network really is — a reminder that the internet's most critical links sit unguarded on the ocean floor.","edition":"Spud's View: AI's Trillion-Dollar Week Meets Fragile Cables","r":3.4,"kws":[]},{"id":"t47","type":"topic","label":"Libghostty 1.0","source":"Hacker News","url":"https://mitchellh.com/writing/libghostty-1-0","summary":"Ghostty, the terminal emulator from HashiCorp co-founder Mitchell Hashimoto, has reached version 1.0, with its core library Libghostty now stable for other developers to build on. The release marks a milestone for a project that has drawn a devoted following among developers who want a fast, native terminal without the usual trade-offs, and it opens the door to a wave of new terminal apps built on the same engine.","edition":"Spud's View: AI's Trillion-Dollar Week Meets Fragile Cables","r":3.4,"kws":[]},{"id":"t48","type":"topic","label":"Free Chinese AI Models Are Getting Scary Good at Hacking","source":"Wired AI","url":"https://www.wired.com/story/free-chinese-ai-models-are-getting-scary-good-at-hacking/","summary":"DeepSeek and GLM, two free Chinese AI models, came close to matching OpenAI's most advanced cyber model — which is not public — in an experiment that asked AI systems to break into simulated networks. The result suggests the gap between open models and frontier labs is narrowing on offensive cybersecurity skills, raising fresh questions about how freely powerful models should be distributed when their hacking ability is nearly on par with the best closed systems.","edition":"Spud's View: AI Hackers, Tokenized Stocks, and a $200B Warning","r":3.4,"kws":["ai","models"]},{"id":"t49","type":"topic","label":"Apple, Meta reject OKX–ICE tokenized stock plans, leaving crypto firms as the ones to watch","source":"Coindesk","url":"https://www.coindesk.com/policy/2026/11/06/apple-meta-reject-okx-ice-tokenized-stock-plans-leaving-crypto-firms-as-the-ones-to-watch","summary":"Apple and Meta have rejected OKX and ICE's tokenized-stock plans, while Strategy, Coinbase, Circle and Robinhood are among six companies from the venture's initial selection with no disclosed objection — after 90% of issuers opted out. The split leaves crypto-native firms as the main champions of putting stocks on-chain, and it shows how cautiously Big Tech is approaching tokenized equities even as the infrastructure gets built.","edition":"Spud's View: AI Hackers, Tokenized Stocks, and a $200B Warning","r":3.4,"kws":["apple","meta","stock","crypto"]},{"id":"t50","type":"topic","label":"Treasury Cuts Crypto Exchange MEXC Off From US Financial System","source":"Decrypt","url":"https://decrypt.co/382758/treasury-cuts-off-crypto-exchange-mexc-us-financial-system","summary":"FinCEN has barred U.S. institutions from any transfers to or from crypto exchange MEXC as part of Operation Economic Outcast, with the Treasury saying the exchange facilitated $16 billion in illicit finance tied to Iran, North Korea and Russia. The move effectively severs MEXC from the American financial system and signals that Washington is willing to use its most sweeping tool against exchanges it links to sanctioned regimes.","edition":"Spud's View: AI Hackers, Tokenized Stocks, and a $200B Warning","r":3.4,"kws":["crypto"]},{"id":"t51","type":"topic","label":"T-Mobile chairman says Starlink Mobile needs $200 billion to compete","source":"Techradar Phones","url":"https://www.techradar.com/phones/network-providers/welcome-to-the-party-t-mobile-chairman-goes-full-john-mcclane-in-defiant-dig-at-elon-musk-and-starlink-mobile-but-says-they-need-usd200-billion-to-play-in-the-industry","summary":"T-Mobile's chairman says Starlink Mobile would need to invest a minimum of $200 billion in spectrum, towers and antennas to compete as a full mobile carrier, a defiant message aimed at Elon Musk's satellite venture as it pushes into phone service. The figure underscores how expensive the ground game still is for a space-based challenger, even one with thousands of satellites already overhead.","edition":"Spud's View: AI Hackers, Tokenized Stocks, and a $200B Warning","r":3.4,"kws":["mobile","starlink"]},{"id":"t52","type":"topic","label":"U.S. prediction markets regulator issues demand that clashes directly with courts","source":"Coindesk","url":"https://www.coindesk.com/policy/2026/11/06/u-s-prediction-markets-regulator-issues-demand-that-clashes-directly-with-courts","summary":"The Commodity Futures Trading Commission has told regulated prediction-market exchanges they cannot cut off customers state by state, a demand that clashes directly with court orders firms like Kalshi are already under. The standoff puts federally regulated markets in an impossible position — obey the regulator or obey the courts — and it is the latest front in the fight over who controls event betting in the U.S.","edition":"Spud's View: AI Hackers, Tokenized Stocks, and a $200B Warning","r":3.4,"kws":[]},{"id":"t53","type":"topic","label":"The iPhone 18 Pro’s new under-display Face ID camera is visible if you look carefully — here’s why Apple moved it there","source":"Techradar Phones","url":"https://www.techradar.com/phones/iphone/noticing-pixelation-in-the-corner-of-your-iphone-18-pros-display-youre-not-alone-but-dont-panic-its-there-by-design","summary":"Apple's iPhone 18 Pro hides its Face ID camera beneath the display, and owners who notice faint pixelation in the corner of the screen are seeing the sensor by design rather than a defect. The move pushes the iPhone closer to a truly uninterrupted screen, trading a visible notch for a subtle artifact that most owners will only spot if they go looking for it.","edition":"Spud's View: AI Hackers, Tokenized Stocks, and a $200B Warning","r":3.4,"kws":["apple"]},{"id":"t54","type":"topic","label":"Nvidia CEO Jensen Huang summoned by Congress over Chinese espionage concerns","source":"Ars Technica","url":"https://arstechnica.com/tech-policy/2026/11/nvidia-ceo-jensen-huang-summoned-by-congress-over-chinese-espionage-concerns/","summary":"Nvidia CEO Jensen Huang has been summoned by Congress to answer questions about his ties to an alleged Chinese intelligence asset, putting the world's most valuable chipmaker at the center of Washington's escalating scrutiny of AI hardware and its path to China. Lawmakers want to know what Huang knew and when, as export controls and national-security politics collide with Nvidia's dominant position in the AI boom.","edition":"Spud's View: Chips, Cash, and the AI Reckoning","r":3.4,"kws":["nvidia"]},{"id":"t55","type":"topic","label":"Ramp data shows AI spending stalling just as Anthropic nears its IPO","source":"Techcrunch","url":"https://techcrunch.com/2026/11/06/ramp-data-shows-ai-spending-stalling-just-as-anthropic-nears-its-ipo/","summary":"Ramp's spending data shows enterprise AI budgets flattening even as usage keeps climbing, a disconnect that lands just as Anthropic prepares to go public. Price cuts and tighter cost controls among the biggest spenders are squeezing revenue growth, challenging the assumption that the AI boom translates directly into ever-rising software spend.","edition":"Spud's View: Chips, Cash, and the AI Reckoning","r":3.4,"kws":["data","ai","anthropic"]},{"id":"t56","type":"topic","label":"DOJ just launched something called the Super Intelligence Task Force","source":"Engadget","url":"https://www.engadget.com/2309257/doj-just-launched-something-called-the-super-intelligence-task-force/","summary":"The U.S. Department of Justice has launched a Super Intelligence Task Force charged with ensuring advanced AI is not manipulated by bad actors at home or abroad. The unit's creation signals that Washington now treats frontier AI as a law-enforcement matter, not just a trade or research question, with the DOJ staking a claim alongside the agencies already circling the technology.","edition":"Spud's View: Chips, Cash, and the AI Reckoning","r":3.4,"kws":[]},{"id":"t57","type":"topic","label":"Fox completes its $22B acquisition of Roku","source":"Techcrunch","url":"https://techcrunch.com/2026/11/06/fox-completes-its-22b-acquisition-of-roku/","summary":"Fox has completed its $22 billion acquisition of Roku, closing one of the largest media deals of the year just months after Justice Department investigators were probing the transaction. The deal folds the streaming platform into Fox's media empire, reshaping the battle for the living-room screen and the advertising dollars that flow through it.","edition":"Spud's View: Chips, Cash, and the AI Reckoning","r":3.4,"kws":[]},{"id":"t58","type":"topic","label":"Kalshi Launches U.S. Stock Perps, Hits $300M","source":"Bankless","url":"https://www.bankless.com/read/news/kalshi-launches-u-s-stock-perps-hits-300m","summary":"Kalshi went live with single-stock perpetual contracts on more than 50 names two days after the CFTC cleared them, and traders moved over $300 million on the first morning. The launch turns the prediction-market platform into a direct competitor to traditional brokerages, bringing crypto-style leverage products into regulated U.S. equities trading.","edition":"Spud's View: Chips, Cash, and the AI Reckoning","r":3.4,"kws":["stock","hits"]},{"id":"t59","type":"topic","label":"AI Companies Really, Really Want to Buy Your Work Files and Emails","source":"Wired General","url":"https://www.wired.com/story/ai-companies-really-really-want-to-buy-your-work-files-and-emails/","summary":"Data brokers are collecting internal corporate files and emails to sell to AI companies hungry for training data, and not everyone whose work is being harvested is thrilled about it. The trade exposes how the race for ever-larger models has moved from scraping the public web to buying up the private paperwork of entire companies.","edition":"Spud's View: Chips, Cash, and the AI Reckoning","r":3.4,"kws":["ai","companies","work"]},{"id":"t60","type":"topic","label":"Fears about an AI crackdown after midterms sparks a $2 trillion rout in tech stocks","source":"NPR","url":"https://www.npr.org/2026/11/05/nx-s1-6031987/stock-markets-ai-midterm-elections","summary":"The Nasdaq dropped more than 5% as investors feared that a Democratic Congress and state governments across the country would crack down on AI and data centers after voters made data-center expansion a midterm issue. Roughly $2 trillion in tech market value was wiped out in the rout, turning local fights over power-hungry server farms into a national reckoning over how fast the AI buildout should go.","edition":"Spud's View: Voters, Markets, and Machines Reckon With AI's Costs","r":3.4,"kws":["ai"]},{"id":"t61","type":"topic","label":"OpenAI is stepping back from NDAs for data center projects","source":"The Verge","url":"https://www.theverge.com/ai-artificial-intelligence/1028454/openai-data-center-nda","summary":"OpenAI announced new commitments to communities hosting its data-center projects, including a promise not to use non-disclosure agreements with public officials, after midterm voters resoundingly opposed data-center expansion. Many projects have relied on NDAs to hide discussions with officials, and the concession signals that the secrecy around AI infrastructure deals is becoming a political liability rather than a convenience.","edition":"Spud's View: Voters, Markets, and Machines Reckon With AI's Costs","r":3.4,"kws":["openai","data","center"]},{"id":"t62","type":"topic","label":"The New York Times is in talks to buy Letterboxd for around $330 million","source":"The Verge","url":"https://www.theverge.com/news/1028375/the-new-york-times-letterboxd-acquisition-report","summary":"The New York Times Company is in exclusive negotiations to acquire Letterboxd, the social network for film lovers, for around $330 million. Sony Pictures Entertainment and A24 were also rumored to be among the suitors, but the Times moved into exclusive talks — a bet that a passionate community of movie fans is worth owning outright as the paper keeps expanding beyond news.","edition":"Spud's View: Voters, Markets, and Machines Reckon With AI's Costs","r":3.4,"kws":[]},{"id":"t63","type":"topic","label":"Bitcoin Fixes This? Paraguay President Resigns After Bank Lockout Hits 60% of Country","source":"Decrypt","url":"https://decrypt.co/382676/paraguay-president-resigns-bank-lockout-bitcoin-fixes-this","summary":"Paraguayan President Santiago Peña resigned after the collapse of digital lender Ueno Bank cut off roughly three million customers — more than 60% of the country's adults — from their accounts. Regulators found Ueno's capital below half the required minimum while the bank held about $800 million in public deposits, and the lower house voted 78-0 to impeach Peña minutes after he quit. The crisis has revived Bitcoin's self-custody argument: money held by an intermediary is only as accessible as that institution allows.","edition":"Spud's View: Voters, Markets, and Machines Reckon With AI's Costs","r":3.4,"kws":["bitcoin","hits"]},{"id":"t64","type":"topic","label":"What is TraderTraitor, the hacking squad behind the $6.3 billion Binance heist?","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/05/what-is-tradertraitor-the-hacking-squad-behind-the-usd6-3-billion-binance-heist","summary":"TraderTraitor, the North Korean hacking squad the FBI linked to the record $6.3 billion Binance heist, gets inside its targets with fake job interviews and rigged coding tests rather than broken cryptography. The same crew was blamed for the $1.5 billion Bybit theft in February 2025, and the Binance haul alone roughly doubled the $6 billion-plus that North Korean hackers had stolen since 2017 — a reminder that the weakest link in crypto security is still a person opening the wrong file.","edition":"Spud's View: Voters, Markets, and Machines Reckon With AI's Costs","r":3.4,"kws":["binance"]},{"id":"t65","type":"topic","label":"Ads in Chatbots Have Arrived. Here’s What’s Working—and What’s Not","source":"Wired AI","url":"https://www.wired.com/story/ads-in-chatbots-have-arrived-heres-whats-working-and-whats-not/","summary":"Anthropic is holding the line against advertising in Claude while the rest of the AI chatbot industry races to sell advertisers on conversational placements without antagonizing users. The split marks the moment chatbots stop being just a tool you pay for and start becoming media — with all the old questions about who the customer really is coming along for the ride.","edition":"Spud's View: Voters, Markets, and Machines Reckon With AI's Costs","r":3.4,"kws":[]},{"id":"t66","type":"topic","label":"Agility Robotics' Nasdaq debut invites scrutiny of humanoid robot market","source":"Ars Technica","url":"https://arstechnica.com/ai/2026/11/agility-robotics-nasdaq-debut-invites-scrutiny-of-humanoid-robot-market/","summary":"Agility Robotics, the American company behind the Digit humanoid warehouse robot, has listed on Nasdaq, putting the humanoid-robot market under public-market scrutiny for the first time. The debut tests whether investors will value warehouse robots as a real business or treat the sector as a speculative bet, with Digit already working in logistics facilities as the proof point either way.","edition":"Spud's View: Robots Go Public, Proofs Get Checked, Chips Run Short","r":3.4,"kws":["market"]},{"id":"t67","type":"topic","label":"Axiom Math wants to keep AI slop out of mathematics","source":"Techcrunch","url":"https://techcrunch.com/2026/11/05/axiom-math-wants-to-keep-ai-slop-out-of-mathematics/","summary":"Axiom Math, a startup building AI agents that formally verify mathematical proofs, says its systems have now checked the Stacks Project, one of mathematics' largest proof libraries. As AI floods the field with unchecked proofs, the company's bet is that verification — not generation — is the scarce skill, and that mathematicians will pay to know which machine-written proofs actually hold up.","edition":"Spud's View: Robots Go Public, Proofs Get Checked, Chips Run Short","r":3.4,"kws":["ai"]},{"id":"t68","type":"topic","label":"Zipline hits $21.5B valuation as Walmart expands bet on drone delivery","source":"Techcrunch","url":"https://techcrunch.com/2026/11/05/zipline-hits-21-5b-valuation-as-walmart-expands-bet-on-drone-delivery/","summary":"Zipline, the drone-delivery company, has raised $1.5 billion at a $21.5 billion valuation while deepening its partnership with Walmart. The round makes Zipline one of the most richly valued logistics startups in the US and signals that Walmart sees autonomous delivery as a real leg of its retail network rather than an experiment.","edition":"Spud's View: Robots Go Public, Proofs Get Checked, Chips Run Short","r":3.4,"kws":["hits","valuation"]},{"id":"t69","type":"topic","label":"Ethereum Is Shipping Around Itself","source":"Bankless","url":"https://www.bankless.com/read/ethereum-is-shipping-around-itself","summary":"Ethereum is gaining faster deposits, cheaper smart contracts, and a post-quantum signature check without a hard fork. The upgrades arrive through the network's existing upgrade path rather than a contentious split, a sign that Ethereum's shipping cadence now runs on incremental improvements instead of the big-bang forks that used to define it.","edition":"Spud's View: Robots Go Public, Proofs Get Checked, Chips Run Short","r":3.4,"kws":[]},{"id":"t70","type":"topic","label":"Alpine Linux Security advisory: OpenSSH-server password authentication bypass","source":"Hacker News","url":"https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/","summary":"Alpine Linux has issued a security advisory for a password-authentication bypass in its OpenSSH server package, urging users to patch. The flaw lets an attacker sidestep password checks on affected Alpine systems, a reminder that even small, security-focused distributions can ship a serious hole in a core service — and that server admins should update before the details circulate widely.","edition":"Spud's View: Robots Go Public, Proofs Get Checked, Chips Run Short","r":3.4,"kws":[]},{"id":"t71","type":"topic","label":"Nintendo's biggest ROM chip supplier is bowing out of the business","source":"Ars Technica","url":"https://arstechnica.com/gaming/2026/11/the-tech-memory-shortage-comes-for-nintendos-cartridge-supply-chain/","summary":"Macronix, Nintendo's main memory-chip maker for physical game cartridges, announced in its third-quarter earnings report that ROM chip production 'has reached its end' and that it will gradually decouple from the game industry. ROM output has already shrunk 39 percent in the last year to just 5 percent of Macronix revenue, a squeeze that could make physical Switch games costlier and push more releases toward download-only.","edition":"Spud's View: Robots Go Public, Proofs Get Checked, Chips Run Short","r":3.4,"kws":[]},{"id":"t72","type":"topic","label":"U.S. Democratic sweep could be the final nail in the ‘Clarity Act’s coffin’","source":"Coindesk","url":"https://www.coindesk.com/policy/2026/11/04/u-s-democratic-sweep-could-be-the-final-nail-in-the-clarity-act-s-coffin","summary":"The Clarity Act, crypto's long-awaited market-structure bill, is likely dead in its current form after Democrats swept Congress, with industry experts warning that incoming majorities will push tighter scrutiny of crypto markets and tokenized stocks instead of the lighter-touch framework the industry spent years lobbying for. The sweep rewrites the legislative calendar: tokenization and stablecoin efforts may survive under existing law, but the comprehensive bill crypto wanted is now a casualty of the blue wave.","edition":"Spud's View: Bills Die, PACs Falter, and Orbit Calls","r":3.4,"kws":[]},{"id":"t73","type":"topic","label":"Crypto's powerhouse super PAC suffers costly setback as Democrats sweep Congress","source":"Coindesk","url":"https://www.coindesk.com/news-analysis/2026/11/04/crypto-s-powerhouse-super-pac-fairshake-found-its-kryptonite","summary":"Fairshake, crypto's powerhouse super PAC, suffered a costly setback in the midterms as Democrats swept Congress, with more than a third of its spending failing to hit the mark — especially in Ohio, where the industry's campaign machine found its kryptonite. The result punctures the PAC's reputation as an unstoppable force and leaves crypto's Washington strategy without its most reliable weapon heading into a tougher Congress.","edition":"Spud's View: Bills Die, PACs Falter, and Orbit Calls","r":3.4,"kws":["crypto"]},{"id":"t74","type":"topic","label":"Hugging Face’s CEO Says His P(Doom) Is ‘Close to Zero’","source":"Wired AI","url":"https://www.wired.com/story/wired-world-fair-2026-clement-delangue-hugging-face/","summary":"Clément Delangue, CEO of Hugging Face, told the WIRED World Fair that his P(doom) — the odds he assigns to AI catastrophe — is 'close to zero,' arguing that most of the real risk comes from a couple of players building powerful models behind closed doors rather than from open development. His case is that open-source AI, with its many eyes and shared scrutiny, is the safer path, not the reckless one.","edition":"Spud's View: Bills Die, PACs Falter, and Orbit Calls","r":3.4,"kws":[]},{"id":"t75","type":"topic","label":"ChatGPT Is Getting a GIF Maker Powered by OpenAI's Unannounced Images 2.6 Model","source":"Decrypt","url":"https://decrypt.co/382574/chatgpt-gif-maker-openai-unannounced-images-2-6-model","summary":"OpenAI is rolling out animated GIF creation inside ChatGPT, powered by its unannounced Images 2.6 model, with frame-by-frame editing and speed controls for tuning the motion. The feature turns the chatbot into a quick meme and animation studio, and its quiet arrival ahead of any formal model announcement suggests OpenAI is shipping image generation as a casual creative tool rather than a flagship reveal.","edition":"Spud's View: Bills Die, PACs Falter, and Orbit Calls","r":3.4,"kws":["openai","model"]},{"id":"t76","type":"topic","label":"US Bank Regulator Issues First AI Framework as Banks Battle Rogue Agents","source":"Decrypt","url":"https://decrypt.co/382560/us-bank-regulator-issues-first-ai-framework-banks-battle-rogue-agents","summary":"The Office of the Comptroller of the Currency has issued its first AI framework for banks, an examiner guide that weighs the autonomy of AI agents against the financial harm they can cause — and directly addresses outside agents operating on customer accounts, the same risk that recently prompted major banks to restrict account access. The guidance lands as banks wrestle with rogue agents acting on their customers' behalf, putting regulators on the record for the first time.","edition":"Spud's View: Bills Die, PACs Falter, and Orbit Calls","r":3.4,"kws":["ai","agents"]},{"id":"t77","type":"topic","label":"SpaceX joins forces with Qualcomm to build Starlink Mobile 5G network","source":"Techradar Phones","url":"https://www.techradar.com/phones/network-providers/spacex-and-qualcomm-join-forces-to-build-starlink-mobile-5g-network-but-elon-musks-bold-plan-to-disrupt-the-entire-industry-could-take-several-years","summary":"SpaceX has joined forces with Qualcomm to build Starlink Mobile, a 5G network beamed from orbit, with Qualcomm supplying the base-station technology for the satellite service. The partnership gives Elon Musk's connectivity ambitions a serious hardware partner, though the plan still needs more spectrum and ground towers — and disrupting the entire mobile industry could take several years to materialize.","edition":"Spud's View: Bills Die, PACs Falter, and Orbit Calls","r":3.4,"kws":["spacex","starlink","mobile"]},{"id":"t78","type":"topic","label":"Binance says hackers who stole billions in crypto spent months planning heist","source":"Ars Technica","url":"https://arstechnica.com/information-technology/2026/11/binance-says-hackers-who-stole-billions-in-crypto-spent-months-planning-heist/","summary":"Binance says the hackers behind the $6.34 billion theft spent months planning the heist, infecting employee laptops, compromising internal tooling, and luring staff with fake job interviews — a slow, patient operation rather than a smash-and-grab, and the largest crypto theft on record. The details reframe the attack as a long con against people, not just code.","edition":"Spud's View: Heists, Blue Waves, and Silicon Valley's Great Rewind","r":3.4,"kws":["binance","hackers","crypto"]},{"id":"t79","type":"topic","label":"Democrats seize full control of Congress. And, which candidates made history last night","source":"NPR","url":"https://www.npr.org/2026/11/04/g-s1-151745/up-first-newsletter-midterms-democrats-congress-control","summary":"Democrats have won the House and the Senate, taking full control of Congress for the first time since 2023, with history made in several states as results rolled in overnight. World leaders from Kyiv to Tehran are now weighing what a flipped Congress means for US foreign policy and international relations.","edition":"Spud's View: Heists, Blue Waves, and Silicon Valley's Great Rewind","r":3.4,"kws":[]},{"id":"t80","type":"topic","label":"Sequoia hits rewind, undoing 20 years of expansion","source":"Techcrunch","url":"https://techcrunch.com/2026/11/04/sequoia-hits-rewind-undoing-20-years-of-expansion/","summary":"Sequoia is consolidating into a smaller, Bay Area-centered firm, shutting down the programs and offices it built during a 20-year expansion while announcing roughly $10 billion in new funds. The retrenchment is a striking reversal for the venture giant that spent two decades growing outward.","edition":"Spud's View: Heists, Blue Waves, and Silicon Valley's Great Rewind","r":3.4,"kws":["hits"]},{"id":"t81","type":"topic","label":"Circle Beats Q3 Estimates on Arc Token Sale, Cuts 5% of Staff","source":"Bankless","url":"https://www.bankless.com/read/news/circle-beats-q3-estimates-on-arc-token-sale-cuts-5-of-staff","summary":"Circle beat third-quarter estimates with revenue up 17% to $865 million, including $182 million from a presale of its ARC token, even as interest income on its USDC reserves slipped. The stablecoin issuer is cutting 5% of its staff despite the beat, a reminder that token-sale windfalls do not insulate a company from cost discipline.","edition":"Spud's View: Heists, Blue Waves, and Silicon Valley's Great Rewind","r":3.4,"kws":[]},{"id":"t82","type":"topic","label":"Google faces backlash for plan that would turn off Search for schools that restrict AI","source":"Techcrunch","url":"https://techcrunch.com/2026/11/04/google-faces-backlash-for-plan-that-would-turn-off-search-for-schools-that-restrict-ai/","summary":"Google faces backlash for a plan that would turn off Search for schools that restrict AI, with politicians including New York City mayor Zohran Mamdani and former FTC chair Lina Khan accusing the company of acting as an unregulated monopoly. The standoff puts classroom AI policy on a collision course with the search giant's leverage.","edition":"Spud's View: Heists, Blue Waves, and Silicon Valley's Great Rewind","r":3.4,"kws":["google","ai"]},{"id":"t83","type":"topic","label":"Americans overwhelmingly voted against data centers in the midterms","source":"Engadget","url":"https://www.engadget.com/2306534/americans-overwhelmingly-voted-against-data-centers-in-the-midterms/","summary":"Voters overwhelmingly rejected data centers in the midterms, with the rebuke strongest in Ohio, which flipped blue. The results turn the AI buildout's appetite for land, power, and water into a ballot-box issue, and a warning that the infrastructure boom now has a political price.","edition":"Spud's View: Heists, Blue Waves, and Silicon Valley's Great Rewind","r":3.4,"kws":["data","centers"]},{"id":"t84","type":"topic","label":"Binance Says Hackers Used Well-Known Tricks to Carry Out a $6.34 Billion Heist","source":"Wired General","url":"https://www.wired.com/story/binance-says-hackers-used-well-known-tricks-to-carry-out-a-dollar634-billion-heist/","summary":"Binance says suspected North Korean hackers stole $6.34 billion after duping an engineer with a fake job interview and a malicious download, using well-known social-engineering tricks rather than a novel exploit to gain a foothold in the exchange's systems. The disclosure makes the October heist the largest crypto theft on record and a case study in how human trust, not broken cryptography, remains the weakest link in exchange security.","edition":"Spud's View: Heists, Chips, and the Grid's New Math","r":3.4,"kws":["binance","hackers"]},{"id":"t85","type":"topic","label":"AMD rides data center riches to 'largest and most profitable' quarter in history","source":"The Verge","url":"https://www.theverge.com/tech/1026148/amd-earnings-q3-2026-data-center-pc","summary":"AMD reported a record $13.4 billion in quarterly revenue for Q3 2026, with CEO Lisa Su calling it the largest and most profitable quarter in the company's history. The data center business drove the surge as AI infrastructure demand kept climbing, and AMD says it expects another record next quarter at $17 billion — a signal that the AI chip race now has a clear second engine behind Nvidia.","edition":"Spud's View: Heists, Chips, and the Grid's New Math","r":3.4,"kws":["data","center"]},{"id":"t86","type":"topic","label":"OpenAI Wants to Rebrand AI Data Centers, Use Them to 'Protect the Grid'","source":"Decrypt","url":"https://decrypt.co/382476/openai-ai-data-centers-rebrand-protect-power-grid","summary":"OpenAI says its future data centers could help 'protect the grid' by cutting power demand during emergencies, pitching the facilities as grid assets rather than just energy hogs. The rebrand attempt lands as AI infrastructure faces growing political scrutiny over electricity use, and it reframes the industry's biggest cost — power — as a public benefit instead of a burden.","edition":"Spud's View: Heists, Chips, and the Grid's New Math","r":3.4,"kws":["openai","ai","data","centers"]},{"id":"t87","type":"topic","label":"Tether Holds 150,000 Bitcoin, CEO Says—About 50,000 More Than Its Reserve Report Shows","source":"Decrypt","url":"https://decrypt.co/382474/tether-holds-150000-bitcoin-ceo-says","summary":"Tether CEO Paolo Ardoino told the Plan ₿ Forum in Lugano that the company owns 'give or take 150,000 Bitcoin,' roughly 50,000 more than the 100,060 implied by its Q3 reserve report. The gap between the CEO's figure and the formal attestation raises fresh questions about how the world's largest stablecoin issuer counts and discloses its reserves.","edition":"Spud's View: Heists, Chips, and the Grid's New Math","r":3.4,"kws":["bitcoin"]},{"id":"t88","type":"topic","label":"Cost per task: Using cheap classifiers to route across Gemini models and thinking levels","source":"Google Dev General","url":"https://developers.googleblog.com/cost-per-task-using-cheap-classifiers-to-route-across-gemini-models-and-thinking-levels/","summary":"Google's developers blog describes a routing trick for autonomous coding agents: cheap classifiers that pick the right Gemini model and thinking level per task, cutting cost per task even as per-token API prices keep falling. The approach treats model selection as an engineering problem — spend the expensive reasoning only where it earns its keep — and it is a practical answer to the ballooning bills behind agentic coding tools.","edition":"Spud's View: Heists, Chips, and the Grid's New Math","r":3.4,"kws":["gemini","models"]},{"id":"t89","type":"topic","label":"CFTC gets into legal clash over stock perps after having cleared path for crypto version","source":"Coindesk","url":"https://www.coindesk.com/policy/2026/11/03/cftc-gets-into-legal-clash-over-stock-perps-after-having-cleared-path-for-crypto-version","summary":"The U.S. Commodity Futures Trading Commission faces a lawsuit from a group backed by Citadel Securities and other firms over its decision to clear a path for stock perpetual futures, which the plaintiffs argue belong under the SEC's jurisdiction. The clash comes just after the CFTC opened the door to crypto perps, and it sets up a turf fight over who regulates the fastest-growing corner of American derivatives trading.","edition":"Spud's View: Heists, Chips, and the Grid's New Math","r":3.4,"kws":["cftc","stock","crypto"]},{"id":"t90","type":"topic","label":"UEFI bootkit infected fully patched Windows machines. Is Microsoft to blame?","source":"Ars Technica","url":"https://arstechnica.com/security/2026/11/uefi-bootkit-infected-fully-patched-windows-machines-is-microsoft-to-blame/","summary":"Microsoft's fully patched Windows machines fell to a new UEFI bootkit called BlackX, which exploits a logic flaw dubbed 'Baton Drop' in the Windows boot manager to bypass Secure Boot — even on systems that had installed every certificate and revocation update Microsoft issued after the BlackLotus attacks of 2023. The bootkit runs malicious code before Windows loads, and under certain conditions can even extract BitLocker encryption keys, raising hard questions about whether Secure Boot's chain of trust can be repaired by patching alone.","edition":"Spud's View: Bootkits, Billions, and the Cost of Intelligence","r":3.4,"kws":["microsoft"]},{"id":"t91","type":"topic","label":"Binance Reopens Withdrawals as FBI Pins $6B Hack on North Korea","source":"Bankless","url":"https://www.bankless.com/read/news/binance-reopens-withdrawals-fbi-pins-hack-on-north-korea","summary":"Binance reopened withdrawals in phases on November 1, days after a record hack of more than $6 billion, and users pulled a net $3.64 billion in the first nine hours — about 2.1 percent of the exchange's $171 billion in assets. The FBI named North Korea's TraderTraitor group as the culprit on October 31, listing 628 addresses tied to the theft, while Binance says it has covered roughly 95 percent of the stolen amount and published a new proof-of-reserves report covering ten major tokens.","edition":"Spud's View: Bootkits, Billions, and the Cost of Intelligence","r":3.4,"kws":["binance","hack"]},{"id":"t92","type":"topic","label":"Anthropic is still grappling with the economics of compute","source":"Techcrunch","url":"https://techcrunch.com/2026/11/03/anthropic-is-still-grappling-with-the-economics-of-compute/","summary":"Anthropic's updated S-1 filing shows revenue reaching $17 billion in the quarter through September 30, up from $11.5 billion the quarter before — but compute costs consumed 58 percent of that revenue, up from 48 percent, pushing the company's operating loss wider. The compute bill hit $10 billion for the quarter, including $5 billion bought under pricey short-term commitments, and revenue per dollar of compute slid to 1.72x from a peak above 2x earlier in the year.","edition":"Spud's View: Bootkits, Billions, and the Cost of Intelligence","r":3.4,"kws":["anthropic","still"]},{"id":"t93","type":"topic","label":"Google will let schools disable its AI tools, but not without sacrificing Search","source":"Techcrunch","url":"https://techcrunch.com/2026/11/03/google-will-let-schools-disable-its-ai-tools-but-not-without-sacrificing-search/","summary":"Google announced it will disable its AI tools for K-12 students next year unless school administrators explicitly opt in — but schools that restrict AI altogether will also lose access to Google Search, because the two are now, in Google's words, 'deeply integrated.' The change spans Gemini, NotebookLM, Gemini in Classroom, and Search, and it forces districts to choose between keeping AI out of classrooms and keeping the search engine their Chromebooks depend on.","edition":"Spud's View: Bootkits, Billions, and the Cost of Intelligence","r":3.4,"kws":["google","ai"]},{"id":"t94","type":"topic","label":"Apple restricts dating apps and AI companions to users 18 and up","source":"Techcrunch","url":"https://techcrunch.com/2026/11/03/apple-restricts-dating-apps-and-ai-companions-to-users-18-and-up/","summary":"Apple is tightening App Store rules so dating apps and AI companions offering sexual or romantic content must carry an 18+ rating, with developers required to add new content descriptors starting November 16. The move lands as AI companion apps — Character.AI, Replika, and xAI's animated companions among them — have been downloaded 220 million times globally, and it follows Apple's broader rollout of age-assurance technology and parental controls.","edition":"Spud's View: Bootkits, Billions, and the Cost of Intelligence","r":3.4,"kws":["apple","apps","ai"]},{"id":"t95","type":"topic","label":"Kalshi Raises $1B at a $40B Valuation as Prediction Market Fees Soar","source":"Bankless","url":"https://www.bankless.com/read/news/kalshi-raises-1b-at-40b-valuation","summary":"Kalshi raised $1 billion at a $40 billion valuation in a Series G round co-led by Wellington and Sequoia, betting that prediction markets have gone mainstream. The company says its annualized trading volume now tops $1 trillion across more than 30 million accounts, and sector fees hit $1.5 billion in the third quarter — up 19 times from a year earlier — as the NBA named Kalshi and Polymarket its preferred prediction-market partners.","edition":"Spud's View: Bootkits, Billions, and the Cost of Intelligence","r":3.4,"kws":["valuation","market"]},{"id":"t96","type":"topic","label":"Claude Fable 5.5, GPT 6.2 Astra Could Be Right Around the Corner, Leaks Suggest","source":"Decrypt","url":"https://decrypt.co/382390/claude-mythos-fable-5-5-gpt-6-2-astra-leaks","summary":"Anthropic's site code reportedly contains a 'Mythos 5.5' label, and users say Claude is already routing some requests to a stronger unreleased model, while OpenAI appears to be testing a model called GPT-6.2 Astra. The leaks suggest both labs are further along on their next flagship models than their public roadmaps admit, and the quiet testing phase may already be reaching real users.","edition":"Spud's View: Leaks, Botnets, and a Hack-Spree Monday","r":3.4,"kws":["claude"]},{"id":"t97","type":"topic","label":"Claude-Built Linux Exploit Targets Bug That Ubuntu Still Hasn't Patched","source":"Decrypt","url":"https://decrypt.co/382375/claude-built-linux-exploit-bug-ubuntu","summary":"Anthropic says Claude wrote an attack that can take over a Linux server with no password at all, a demonstration of AI-written offensive capability that lands uncomfortably close to home. Red Hat patched the flaw on Sunday, but Ubuntu still has no fix, leaving a window where the exploit is public knowledge and one major distribution remains exposed.","edition":"Spud's View: Leaks, Botnets, and a Hack-Spree Monday","r":3.4,"kws":["claude","still"]},{"id":"t98","type":"topic","label":"One of Google's Android partners turned 1.3 million set-top boxes into a botnet","source":"The Verge","url":"https://www.theverge.com/1024807/google-botnet-android-tv-shut-down","summary":"Google says one of its Android manufacturing partners secretly built a backdoor into 1.3 million set-top boxes and turned them into a botnet, a supply-chain compromise at a scale that dwarfs most malware campaigns. Google says it has dismantled the backdoor and cut ties with Shenzhen-based Videostrong Technology Co., which is now banned from building or selling certified Android devices.","edition":"Spud's View: Leaks, Botnets, and a Hack-Spree Monday","r":3.4,"kws":["google"]},{"id":"t99","type":"topic","label":"Hundreds of Mundane AI Apps Are Hiding Sexually Abusive Deepfake Features","source":"Wired AI","url":"https://www.wired.com/story/hundreds-of-mundane-ai-apps-are-hiding-abusive-deepfake-features/","summary":"WIRED uncovered some 400 apps and websites linked to Chinese-language developers that look like regular AI tools but secretly let users create violent AI-generated images and video. The apps hide their abusive features behind mundane interfaces, showing how easily deepfake generation can be smuggled into the app stores in plain sight.","edition":"Spud's View: Leaks, Botnets, and a Hack-Spree Monday","r":3.4,"kws":["ai","apps"]},{"id":"t100","type":"topic","label":"NYSE tokenized stock plans take shape as four more transfer agents join","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/02/nyse-taps-wall-street-giant-broadridge-to-bring-shareholder-voting-onto-blockchain-rails","summary":"Broadridge, Computershare, Equiniti and Superstate have joined the New York Stock Exchange's planned blockchain market, bringing shareholder records and voting services onchain. The move puts the plumbing of the world's largest stock exchange onto tokenized rails, a step from pilot projects toward the core infrastructure of equities.","edition":"Spud's View: Leaks, Botnets, and a Hack-Spree Monday","r":3.4,"kws":["stock","agents"]},{"id":"t101","type":"topic","label":"Brazil's Mercado Bitcoin halts withdrawals after $40 million drained across 10 chains","source":"Coindesk","url":"https://www.coindesk.com/business/2026/11/02/brazil-s-mercado-bitcoin-halts-withdrawals-after-usd40-million-drained-across-10-chains","summary":"Brazil's Mercado Bitcoin paused deposits and withdrawals after wallets on at least ten chains were emptied of roughly $40 million, the second major exchange drain in days following the $6.3 billion Binance hack. The halt leaves Brazilian customers locked out while the exchange traces how the funds moved across so many chains at once.","edition":"Spud's View: Leaks, Botnets, and a Hack-Spree Monday","r":3.4,"kws":["bitcoin"]},{"id":"t102","type":"topic","label":"🏴 Binance's Record Hack","source":"Bankless","url":"https://www.bankless.com/read/binances-record-hack","summary":"Binance confirmed that attackers drained $6.3 billion from its hot wallets, the largest crypto exchange hack ever recorded, and the company says it will cover the full loss while withdrawals remain paused pending a security review. The breach dwarfs every previous exchange theft and lands as a stress test for centralized custody, with traders watching when withdrawals reopen and what the post-mortem reveals about how the wallets were compromised.","edition":"Spud's View: Hacks, Rockets, and Machines That Predict Us","r":3.4,"kws":["binance","hack"]},{"id":"t103","type":"topic","label":"SpaceX reportedly wants to buy Boost Mobile to compete with AT&T, T-Mobile, and Verizon","source":"Techcrunch","url":"https://techcrunch.com/2026/11/02/spacex-reportedly-wants-to-buy-boost-mobile-to-compete-with-att-t-mobile-and-verizon/","summary":"SpaceX is reportedly pursuing a purchase of Boost Mobile, a deal that would give its Starlink satellite network the terrestrial cellular access it has been missing and put it in direct competition with AT&T, T-Mobile, and Verizon. The tie-up would turn a satellite broadband provider into a full mobile carrier, and it signals how seriously SpaceX is taking the race to own connectivity from orbit to the handset.","edition":"Spud's View: Hacks, Rockets, and Machines That Predict Us","r":3.4,"kws":["spacex","reportedly","mobile"]},{"id":"t104","type":"topic","label":"42AI comes out of stealth with $62.5M and a world model that can ‘predict human behavior’","source":"Techcrunch","url":"https://techcrunch.com/2026/11/02/42ai-comes-out-of-stealth-with-62-5m-and-a-world-model-that-can-predict-human-behavior/","summary":"42AI emerged from stealth with $62.5 million in funding and a world model it claims can predict what people will do before they decide, even in situations the system has never encountered. The pitch reads like science fiction — behavior forecasting as a product — and the funding round shows investors are still willing to bet big on the idea that modeling human action is the next frontier after modeling language.","edition":"Spud's View: Hacks, Rockets, and Machines That Predict Us","r":3.4,"kws":["model"]},{"id":"t105","type":"topic","label":"Elon Musk throttles Grok Bot limits due to ‘unsustainably high’ costs","source":"Techcrunch","url":"https://techcrunch.com/2026/11/02/elon-musk-throttles-grok-bot-limits-
